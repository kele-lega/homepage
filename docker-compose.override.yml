# 本地开发覆盖文件
# 用法：在本地直接 `docker compose up -d` 即可生效
# 原理：docker compose 自动合并 docker-compose.yml + docker-compose.override.yml
#
# 效果：
#   - homepage 恢复 3000:3000 端口映射，浏览器直接访问 http://localhost:3000
#   - glances 恢复 61208:61208 端口映射，直接访问 http://localhost:61208
#   - caddy 不启动（本地不需要 HTTPS/认证）
#   - 其余服务不变
#
# 生产环境部署时：
#   docker compose -f docker-compose.yml up -d   # 指定只用主文件，忽略 override

services:
  homepage:
    ports:
      - "3000:3000"

  glances:
    ports:
      - "61208:61208"

  # 本地没有 caddy 做同源反代，所以直接开端口 + 白名单放开本机来源
  # homepage 本地端口可能是 3000 或 3001，两个都列上；生产走 /fund-monitor
  # 同源路径，不需要 CORS，也不开这个端口
  fund-monitor:
    ports:
      - "8090:8090"
    environment:
      - FUND_ALLOW_ORIGIN=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001

  caddy:
    profiles:
      - production
