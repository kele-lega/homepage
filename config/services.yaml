---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/

- 甲:
    - Calendar:
        widget:
          type: calendar
          view: monthly
          firstDayInWeek: monday
          timezone: Asia/Shanghai

- 乙:
    - BiliBili:
        icon: /images/app/bilibili.svg
        href: "https://www.bilibili.com"
        description: 哔哩哔哩 - ( ゜- ゜)つロ 乾杯~
        ping: bilibili.com
    

- 丙:
    - Docker 容器:
        icon: mdi-docker
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: containers
          chart: true

- 丁:
    - CPU 使用率:
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: cpu
          chart: false
    - 内存使用率:
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: memory
          chart: false
    - 网络流量:
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: network:eth0
          chart: false
    - 磁盘使用率:
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: fs:/
          chart: false
