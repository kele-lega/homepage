---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/

- 日历:
    - Calendar:
        widget:
          type: calendar
          view: monthly
          firstDayInWeek: monday
          timezone: Asia/Shanghai

- 预留1:
    - Placeholder:
        href: "#"
        description: 待配置

- 预留2:
    - Placeholder:
        href: "#"
        description: 待配置

- 系统监控:
    - CPU 使用率:
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: cpu
          chart: true
    - 网卡流量:
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: network:eth0
          chart: true
    - 内存使用率:
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: memory
          chart: true
    - 磁盘 IO:
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: disk:sda
          chart: true
