services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    entrypoint: ["/custom-entrypoint.sh"]
    command: ["node", "server.js"]
    # 生产不映射宿主机端口，由 Caddy 反代；本地端口见 docker-compose.override.yml
    expose:
      - "3000"
    volumes:
      - ./config:/app/config
      - ./public:/app/public
      - ./entrypoint.sh:/custom-entrypoint.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      HOMEPAGE_ALLOWED_HOSTS: localhost,localhost:3000,127.0.0.1,127.0.0.1:3000,103.79.186.22,kelelega.dpdns.org
    restart: unless-stopped
    depends_on:
      - glances

  # 系统监控数据源：为 Homepage 的 glances widget 提供 REST API
  # 同机部署，Homepage 通过 http://glances:61208 访问
  # pid: host 让 glances 采集宿主机的真实 CPU/网卡/内存数据
  glances:
    image: nicolargo/glances:latest
    container_name: glances
    pid: host
    expose:
      - "61208"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 挂载宿主机根分区（只读），让 glances 能看到真实的磁盘使用率
      - /:/host:ro
    environment:
      # 开 Web API 模式（-w），监听 61208；不开认证
      GLANCES_OPT: "-w"
    restart: unless-stopped

  # iCal 中转代理：解决 Homepage Node fetch 默认 UA 被 Google 当 bot 拒绝的问题
  # Google 直接拉返回 HTML 404 错误页（JSON 解析失败），本服务带 Mozilla UA 中转
  # URL 通过环境变量注入，不在源码里硬编码私有 token
  ical-proxy:
    image: python:3.12-alpine
    container_name: ical-proxy
    working_dir: /app
    expose:
      - "8089"
    volumes:
      - ./ical-proxy:/app:ro
    environment:
      - ICAL_UPSTREAM=${ICAL_UPSTREAM:-https://calendar.google.com/calendar/ical/REPLACE_ME/public/basic.ics}
    command: ["python", "-u", "ical-proxy.py"]
    restart: unless-stopped

  # 基金净值监控：后台常驻抓取估算/正式净值，JSON 文件持久化
  # 只在内网暴露，浏览器经 caddy 的 /fund-monitor/* 同源访问
  fund-monitor:
    build: ./fund-monitor
    container_name: fund-monitor
    # 生产不映射宿主机端口，由 Caddy /fund-monitor 同源反代；本地 8090 见 override
    expose:
      - "8090"
    volumes:
      # 数据目录挂宿主机，容器重启后基金列表和缓存不丢
      - ./fund-monitor/data:/app/data
    environment:
      - FUND_DATA_DIR=/app/data
      - FUND_HOST=0.0.0.0
      - FUND_PORT=8090
      - FUND_ALLOW_ORIGIN=http://localhost:3000,http://127.0.0.1:3000
      - FUND_REFRESH_SEC=${FUND_REFRESH_SEC:-60}
    restart: unless-stopped

  # Caddy 反向代理：自动 HTTPS + HTTP Basic Auth
  # 80/443 对外，内部反代到 homepage:3000
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - AUTH_USER=${AUTH_USER:-admin}
      - AUTH_HASH=${AUTH_HASH}
    restart: unless-stopped
    depends_on:
      - homepage
      - fund-monitor

volumes:
  caddy_data:
  caddy_config:
