services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    entrypoint: ["/custom-entrypoint.sh"]
    command: ["node", "server.js"]
    # 不暴露外网端口，仅在内网被 caddy 反代
    expose:
      - "3000"
    volumes:
      - ./config:/app/config
      - ./public:/app/public
      - ./entrypoint.sh:/custom-entrypoint.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      HOMEPAGE_ALLOWED_HOSTS: localhost,127.0.0.1,103.79.186.22,kelelega.dpdns.org
    restart: unless-stopped
    depends_on:
      - glances

  # 系统监控数据源：为 Homepage 的 glances widget 提供 REST API
  # 同机部署，Homepage 通过 http://glances:61208 访问
  # pid: host 让 glances 采集宿主机的真实 CPU/网卡/内存数据
  glances:
    image: nicolargo/glances:latest
    container_name: glances
    pid: host
    ports:
      - "61208:61208"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # 开 Web API 模式（-w），监听 61208；不开认证
      GLANCES_OPT: "-w"
    restart: unless-stopped

  # iCal 中转代理：解决 Homepage Node fetch 默认 UA 被 Google 当 bot 拒绝的问题
  # Google 直接拉返回 HTML 404 错误页（JSON 解析失败），本服务带 Mozilla UA 中转
  # URL 通过环境变量注入，不在源码里硬编码私有 token
  ical-proxy:
    image: python:3.12-alpine
    container_name: ical-proxy
    working_dir: /app
    expose:
      - "8089"
    volumes:
      - ./ical-proxy:/app:ro
    environment:
      - ICAL_UPSTREAM=${ICAL_UPSTREAM:-https://calendar.google.com/calendar/ical/REPLACE_ME/public/basic.ics}
    command: ["python", "-u", "ical-proxy.py"]
    restart: unless-stopped

  # Caddy 反向代理：自动 HTTPS + HTTP Basic Auth
  # 80/443 对外，内部反代到 homepage:3000
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - AUTH_USER=${AUTH_USER:-admin}
      - AUTH_HASH=${AUTH_HASH}
    restart: unless-stopped
    depends_on:
      - homepage

volumes:
  caddy_data:
  caddy_config:
