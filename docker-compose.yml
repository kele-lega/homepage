services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - "3001:3000"
    volumes:
      - ./config:/app/config
      - ./public:/app/public
    environment:
      HOMEPAGE_ALLOWED_HOSTS: localhost:3001,127.0.0.1:3001
    restart: unless-stopped