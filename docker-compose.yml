services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    entrypoint: ["/custom-entrypoint.sh"]
    command: ["node", "server.js"]
    ports:
      - "3001:3000"
    volumes:
      - ./config:/app/config
      - ./public:/app/public
      - ./entrypoint.sh:/custom-entrypoint.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      HOMEPAGE_ALLOWED_HOSTS: localhost:3001,127.0.0.1:3001,103.79.186.22:3001
    restart: unless-stopped
    depends_on:
      - glances

  # 系统监控数据源：为 Homepage 的 glances widget 提供 REST API
  # 同机部署，Homepage 通过 http://glances:61208 访问
  # pid: host 让 glances 采集宿主机的真实 CPU/网卡/内存数据
  glances:
    image: nicolargo/glances:latest
    container_name: glances
    pid: host
    ports:
      - "61208:61208"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # 开 Web API 模式（-w），监听 61208；不开认证
      GLANCES_OPT: "-w"
    restart: unless-stopped

  # iCal 中转代理：解决 Homepage Node fetch 默认 UA 被 Google 当 bot 拒绝的问题
  # Google 直接拉返回 HTML 404 错误页（JSON 解析失败），本服务带 Mozilla UA 中转
  # URL 通过环境变量注入，不在源码里硬编码私有 token
  ical-proxy:
    image: python:3.12-alpine
    container_name: ical-proxy
    working_dir: /app
    volumes:
      - ./ical-proxy:/app:ro
    environment:
      # 在本机或自己创建 .env 文件设置：
      #   ICAL_UPSTREAM=https://calendar.google.com/calendar/ical/.../basic.ics
      # 私密 token 不要直接写在这里，会进 git history。
      - ICAL_UPSTREAM=${ICAL_UPSTREAM:-https://calendar.google.com/calendar/ical/REPLACE_ME/public/basic.ics}
    command: ["python", "-u", "ical-proxy.py"]
    restart: unless-stopped